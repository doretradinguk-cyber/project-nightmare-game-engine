<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Nightmare // Virtual Sandbox</title>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/nightmare.css">
<link rel="stylesheet" href="../css/sandbox.css">
</head>
<body data-page="sandbox">
<div id="app"></div>
<script type="module">
import { bootMansion } from '../js/engine/mansion-bootstrap.js';

const app=document.querySelector('#app');
app.innerHTML='<main class="nightmare-shell sandbox-view"><header class="nightmare-header"><small>PROJECT NIGHTMARE // ENVIRONMENT LAB</small><h1>VIRTUAL SANDBOX</h1><p>MANSION // FIRST ENVIRONMENT</p></header><section class="sandbox-console"><div class="sandbox-toolbar"><button id="load">LOAD MANSION</button><button id="fullscreen">FULLSCREEN</button><span id="status">STANDBY</span></div><canvas id="sandbox-canvas" aria-label="Mansion environment viewport"></canvas><aside><strong>ENVIRONMENT</strong><span>MANSION</span><strong>ROOM</strong><span id="room">FOYER</span><strong>POWER</strong><span id="power">68%</span><strong>SURVEILLANCE</strong><span>ACTIVE</span></aside></section></main>';

let runtime=null;
document.querySelector('#load').addEventListener('click',()=>{
  runtime ??= bootMansion(document.querySelector('#sandbox-canvas'));
  document.querySelector('#status').textContent='MANSION LOADED // WEBGL READY: '+runtime.renderer.ready;
});
document.querySelector('#fullscreen').addEventListener('click',()=>{
  document.querySelector('#sandbox-canvas').requestFullscreen?.();
});
</script>
</body>
</html>
